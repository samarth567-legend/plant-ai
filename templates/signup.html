<!DOCTYPE html>

<html>

<head>

    <title>Plant AI - Sign Up</title>

    <style>

        body {

            margin: 0;

            font-family: Arial;

            background: #10231b;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

        }


        .box {

            width: 350px;

            padding: 40px;

            background: #1f3d2e;

            border-radius: 20px;

        }


        input {

            width: 100%;

            padding: 13px;

            margin: 10px 0;

            box-sizing: border-box;

            border: none;

            border-radius: 8px;

        }


        button {

            width: 100%;

            padding: 13px;

            margin-top: 10px;

            background: #c9a24a;

            border: none;

            border-radius: 25px;

            cursor: pointer;

        }


        a {

            color: #e6c579;

        }

    </style>

</head>


<body>


<div class="box">


    <h1>
        🌿 Plant AI
    </h1>


    <h2>
        Create Account
    </h2>



    <form
        method="POST"
        action="{{ url_for('signup') }}"
    >


        <input
            type="text"
            name="name"
            placeholder="Your Name"
            required
        >


        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >


        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >


        <button type="submit">
            Create Account
        </button>


    </form>



    <p>

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </p>


</div>


</body>

</html>
